name: Portable Linux package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning reads the repository history.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify shader build checks
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Rebuild OpenGL shaders
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64
          ./scripts/build-shaders.sh --profile OpenGL --output Source/Shaders/prebuilt/OpenGL --check
      - name: Build, test and publish
        working-directory: Source
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          AVALONIA_TELEMETRY_OPTOUT: '1'
          NUGET_PACKAGES: ${{ runner.temp }}/riel-nuget
        run: |
          set -euo pipefail
          dotnet test Test/Tests.Launcher.Gui/Tests.Launcher.Gui.csproj -c Release
          dotnet test Test/Tests.Orts/Tests.Orts.csproj -c Release
          dotnet test Test/Tests.Riel/Tests.Riel.csproj -c Release
          for project in \
            ActivityRunner/ActivityRunner.csproj \
            Launcher.Cli/Launcher.Cli.csproj \
            Launcher.Gui/Launcher.Gui.csproj \
            MultiPlayer.Hub/MultiPlayer.Hub.csproj
          do
            dotnet publish "$project" -c Release -r linux-x64 --self-contained true \
              -o "${RUNNER_TEMP}/riel-publish"
          done
          # Nothing from this build step needs to be exported to later steps.
          # A build tool can leave non-environment text in GitHub's command file;
          # GitHub rejects the entire successful step when it parses that text.
          : > "$GITHUB_ENV"
      - name: Install Qt for Riel Route Editor
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets
          cache: true
          setup-python: false

      - name: Build native Riel Route Editor
        env:
          TSRE5VC_COMMIT: 15a5d148a15ad305e14a9e602961210ad18ada74
          XDG_STATE_HOME: ${{ runner.temp }}/riel-editor-state
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ \
            libopenal-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth

          editor_src="${RUNNER_TEMP}/tsre5vc"
          editor_build="${RUNNER_TEMP}/tsre5vc-build"
          editor_out="${RUNNER_TEMP}/riel-route-editor"

          git clone --filter=blob:none https://github.com/GokuMK/TSRE5vc.git "$editor_src"
          git -C "$editor_src" checkout --detach "$TSRE5VC_COMMIT"
          python3 scripts/prepare-route-editor-source.py "$editor_src"
          cp LICENSE "$editor_src/LICENSE.md"

          riel_version="$(python3 -c 'import json; print(json.load(open("Source/version.json"))["version"])')"
          cmake -S "$editor_src" -B "$editor_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTSRE5_VERSION="$riel_version+${GITHUB_SHA:0:12}" \
            -DTSRE_BUILD_ACE_TESTS=OFF \
            -DTSRE_BUILD_TOKEN_TESTS=OFF \
            -DTSRE_BUILD_SHAPE_TESTS=OFF \
            -DTSRE_BUILD_CONTENT_CASE_TESTS=OFF \
            -DTSRE_BUILD_GEO_TESTS=OFF
          cmake --build "$editor_build" --parallel
          "$editor_build/riel_content_index_tests"
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$editor_build/riel_loader_safety_tests"
          python3 scripts/make-editor-test-content.py "${RUNNER_TEMP}/riel-editor-content"
          python3 scripts/test-editor-window-watchdog.py "$editor_src" "$editor_build" \
            "${RUNNER_TEMP}/riel-editor-content/Train Simulator"

          scripts/bundle-route-editor-linux.sh "$editor_build/TSRE5vc" "$editor_out"
          cp -a "$editor_src/appdata" "$editor_out/appdata"
          cp packaging/linux/riel-route-editor.png "$editor_out/riel-route-editor.png"
          mkdir -p "$editor_out/share/applications" "$editor_out/share/icons/hicolor/256x256/apps"
          cp packaging/linux/riel-route-editor.desktop "$editor_out/share/applications/"
          cp packaging/linux/riel-route-editor.png "$editor_out/share/icons/hicolor/256x256/apps/"
          cp LICENSE "$editor_out/LICENSE-GPL-3.0.txt"
          cp CREDITS.md "$editor_out/CREDITS.md"
          cp docs/route-editor.md "$editor_out/README.md"
          cat > "$editor_out/SOURCE.txt" <<EOF
          Riel Route Editor is built from TSRE5vc.
          Creator: Piotr Gadecki (GokuMK), creator of TSRE5 and TSRE5vc.
          Upstream: https://github.com/GokuMK/TSRE5vc
          Commit: $TSRE5VC_COMMIT
          Riel integration patch: scripts/prepare-route-editor-source.py
          License: GNU GPL 3.0 or later (see upstream source headers and LICENSE-GPL-3.0.txt)
          Settings: ~/.local/share/Riel/RouteEditor/settings.json on a default Linux desktop
          EOF

          tar --exclude=.git -czf "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" -C "${RUNNER_TEMP}" tsre5vc

          QT_QPA_PLATFORM=offscreen "$editor_out/riel-route-editor" --version
          QT_QPA_PLATFORM=offscreen "$editor_out/riel-route-editor" --test-list
          QT_QPA_PLATFORM=offscreen "$editor_out/riel-route-editor" --test --test-suite content-path
          QT_QPA_PLATFORM=offscreen "$editor_out/riel-route-editor" --test --test-suite settings
          grep -F "workingDir \"$editor_out\"" "$XDG_STATE_HOME/riel/Logs/Riel Route Editor Log.txt"
          xvfb-run -a "$editor_out/riel-route-editor" --graphics-check
          timeout 15s xvfb-run -a "$editor_out/riel-route-editor" --route-action-check
          for extra in "" "--set core.startup.useTilePosition=true --set core.startup.tileX=-6 --set core.startup.tileZ=12"; do
            timeout 40s xvfb-run -a env \
              RIEL_EDITOR_RENDER_DIAGNOSTICS=1 \
              RIEL_EDITOR_ASYNC_TEXTURES=1 \
              RIEL_EDITOR_TEXTURE_WORKERS=2 \
              'RIEL_EDITOR_CHECK_SHAPES=XTrackOnly.S;YTrackOnly.S;RouteOnly.S' \
              RIEL_EDITOR_CHECK_TEXTURES=EditorFixture.ACE \
              "$editor_out/riel-route-editor" \
              --game-root "${RUNNER_TEMP}/riel-editor-content/Train Simulator" \
              --route RIELTEST --route-full-window-check $extra
            for marker in navi-created main-created main-shown first-frame event-loop-responsive; do
              grep -F "RIEL_EDITOR_WINDOW $marker" "$XDG_STATE_HOME/riel/Logs/Riel Route Editor Log.txt"
            done
          done
          grep -F "RIEL_TEXTURE_POOL workers=2" "$XDG_STATE_HOME/riel/Logs/Riel Route Editor Log.txt"
          timeout 45s xvfb-run -a "$editor_out/riel-route-editor" --ace-preview-check
          timeout 45s xvfb-run -a env \
            RIEL_EDITOR_RENDER_DIAGNOSTICS=1 \
            RIEL_EDITOR_ASYNC_TEXTURES=1 \
            RIEL_EDITOR_TEXTURE_WORKERS=2 \
            "$editor_out/riel-route-editor" \
            --game-root "${RUNNER_TEMP}/riel-editor-content/Train Simulator" \
            --consist-selection-check
      - name: Package and verify without an installed .NET runtime
        env:
          DOTNET_ROOT: /nonexistent-dotnet-runtime
          DOTNET_MULTILEVEL_LOOKUP: '0'
          XDG_CONFIG_HOME: ${{ runner.temp }}/riel-profile/config
          XDG_DATA_HOME: ${{ runner.temp }}/riel-profile/data
          XDG_STATE_HOME: ${{ runner.temp }}/riel-profile/state
          XDG_CACHE_HOME: ${{ runner.temp }}/riel-profile/cache
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/riel-linux-x64"
          mkdir -p "$bundle/app"
          cp README.md CREDITS.md CHANGELOG.md CONTRIBUTING.md LICENSE "$bundle/"
          cp -a docs "$bundle/docs"
          cp -a "${RUNNER_TEMP}/riel-publish/." "$bundle/app/"
          mkdir -p "$bundle/app/route-editor"
          cp -a "${RUNNER_TEMP}/riel-route-editor/." "$bundle/app/route-editor/"
          install -m 755 packaging/linux/riel-portable "$bundle/riel"
          find "$bundle/app" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          if [ -d "$bundle/app/runtimes" ]; then
            find "$bundle/app/runtimes" -mindepth 1 -maxdepth 1 \
              ! -name linux-x64 ! -name unix -exec rm -rf {} +
          fi
          python3 Source/Tools/TestRoute/make_test_route.py "${RUNNER_TEMP}/riel-test-content"
          "$bundle/riel" content add Test "${RUNNER_TEMP}/riel-test-content/Train Simulator"
          "$bundle/riel" content list | grep -F Test
          # The portable wrapper must keep finding app/ when invoked through PATH.
          mkdir -p "${RUNNER_TEMP}/riel-path"
          ln -s "$bundle/riel" "${RUNNER_TEMP}/riel-path/riel"
          PATH="${RUNNER_TEMP}/riel-path:$PATH" riel version
          test -x "$bundle/app/route-editor/riel-route-editor"
          test -f "$bundle/app/route-editor/LICENSE-GPL-3.0.txt"
          test -f "$bundle/app/route-editor/CREDITS.md"
          grep -F 'Piotr Gadecki (GokuMK)' "$bundle/CREDITS.md"
          QT_QPA_PLATFORM=offscreen "$bundle/app/route-editor/riel-route-editor" --version
          QT_QPA_PLATFORM=offscreen "$bundle/app/route-editor/riel-route-editor" --test-list
          QT_QPA_PLATFORM=offscreen "$bundle/riel" route-editor --version
          xvfb-run -a "$bundle/riel" route-editor --graphics-check
          tar -czf "${RUNNER_TEMP}/riel-linux-x64.tar.gz" -C "${RUNNER_TEMP}" riel-linux-x64
          (cd "${RUNNER_TEMP}" && zip -qr riel-linux-x64.zip riel-linux-x64)
          (cd "${RUNNER_TEMP}" && sha256sum riel-linux-x64.zip > riel-linux-x64.zip.sha256)
          du -h "${RUNNER_TEMP}/riel-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: riel-linux-x64
          path: |
            ${{ runner.temp }}/riel-linux-x64.tar.gz
            ${{ runner.temp }}/riel-route-editor-source.tar.gz
          if-no-files-found: error
      - name: Publish tested main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA:0:12}"
          title="Riel main ${GITHUB_SHA:0:12}"
          notes="Portable Linux build of ${GITHUB_SHA}. Includes the .NET runtime and native Riel editor suite. Matching editor source is attached."

          if gh release view "$tag" >/dev/null 2>&1; then
            # A force-push/rollback can legitimately rebuild a commit whose
            # release tag already exists. Refresh its assets instead of failing.
            gh release upload "$tag" \
              "${RUNNER_TEMP}/riel-linux-x64.zip" \
              "${RUNNER_TEMP}/riel-linux-x64.zip.sha256" \
              "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" \
              --clobber
            gh release edit "$tag" --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create "$tag" \
              "${RUNNER_TEMP}/riel-linux-x64.zip" \
              "${RUNNER_TEMP}/riel-linux-x64.zip.sha256" \
              "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "$title" --notes "$notes"
          fi
      - name: Publish stable release for tested version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("Source/version.json"))["version"])')"
          if [[ "$version" == *-* || "$version" == *'{'* ]]; then
            echo "Development version $version; no stable release"
            exit 0
          fi
          release_notes() {
            local release_tag="$1"
            local release_sha="$2"
            case "$release_tag" in
              v1.0.0)
                printf 'Stable portable Linux build of %s.\n\n' "$release_sha"
                cat docs/releases/1.0.0.md
                ;;
              v0.1.0)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Highlights\n- First stable Riel Linux release.\n- Renamed the public assemblies, namespaces and common library from \`FreeTrainSimulator.*\` to \`Riel.*\`.\n- Kept launcher/update checks working through the repository rename.\n- Hardened Linux activity testing so startup failures are logged and batch testing can continue.\n- Improved native AI train visual loading, nearby-train prioritization and related diagnostics.\n- Added the F3 system information overlay and Linux temperature reporting.\n\n### Compatibility / known issues\n- Bundled Riel assemblies already use the \`Riel.*\` names.\n- Only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding.\n- Older saves made before the assembly rename have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              v0.1.1)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Changes\n- Adjusted the particle vertex layout/stride handling as an OpenGL compatibility step for smoke rendering.\n- Bumped the stable version to 0.1.1.\n\n### Note\n- This was an intermediate particle-rendering fix. The final DesktopGL billboard fix that makes smoke/steam/spray particles visible landed in Riel 0.1.2.\n\n### Compatibility / known issues\n- Bundled Riel assemblies already use the \`Riel.*\` names.\n- Only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding.\n- Older saves have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              v0.1.2)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Particle rendering fixes\n- Fixed the particle-emitter ring-buffer indexing/off-by-one issue.\n- Restored the Open Rails 80-byte particle vertex stride.\n- Added particle/diesel exhaust diagnostics and exposed them in Settings.\n- Added recovery when DesktopGL invalidates a dynamic particle vertex buffer.\n- Fixed the actual DesktopGL billboard shader bug: static corner arrays could be compiled as zeroed uniforms, collapsing every particle quad to zero area.\n- Smoke, steam and other effects using the generic particle emitter can now render correctly on native Linux/OpenGL.\n\n### Compatibility / known issues\n- Bundled Riel assemblies already use the \`Riel.*\` names.\n- Only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding.\n- Older saves have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              v0.1.9)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Nearby train loading\n- Extends the 0.1.8 fix to complete trains near the camera or any part of the player consist.\n- Prevents camera changes between the player's ends from discarding adjacent train models.\n- Uses tiled horizontal squared distance; trains outside both reference areas continue to unload.\n- Nearby trains may retain more models in memory; ordinary rendering range and model detail selection are preserved.\n\n### Diagnostics and validation\n- Extends opt-in train visibility diagnostics to other vehicles near the camera.\n- Includes production-loader regressions for adjacent trains across tiles, traffic near the player's rear, free cameras, uncoupling and eventual unloading.\n- Two regressions reproduce model unloading with the previous 0.1.8 selection policy.\n- Confirmation on the user's original route and NVIDIA GPU remains pending.\n\n### Included fixes\n- Includes the player-consist retention, shader camera snapshot and three-dimensional MSTS track placement fixes.\n- Native editor code is unchanged; corresponding source and TSRE5vc credits are included."
                ;;
              v0.1.8)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Camera changes on long trains\n- Keeps the complete player consist loaded when changing cameras between its ends.\n- Prevents nearby wagons or locomotives from waiting for a model reload after the opposite end was streamed out on a curve.\n- Uses the USA2/autotrnsetout visibility trace to reproduce the failure in production loader tests.\n- Detached cars and other trains continue to stream by distance; ordinary shape culling and model detail selection are preserved.\n\n### Included fixes and status\n- Includes the shader camera snapshot and three-dimensional MSTS track placement fixes.\n- Confirmation with the original route on the user's NVIDIA GPU remains pending.\n- Native editor code is unchanged; corresponding source and TSRE5vc credits are included."
                ;;
              v0.1.7)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Rendering consistency\n- Uses the prepared frame's camera position for shader distance fading, fog and specular lighting.\n- Fixes a remaining camera race that could fade blended rolling-stock materials to zero alpha across a tile boundary.\n- Preserves the three-dimensional MSTS track placement from 0.1.6.\n\n### Train visibility diagnostics\n- Adds Settings > Advanced > Train visibility diagnostics.\n- Records actual model detail selection, culling, submitted meshes and vehicle transforms in the simulator log.\n- Can also be enabled with RIEL_TRACE_TRAIN_VISUALS=1.\n\n### Validation and status\n- Includes production shader-uniform and shape-preparation regression tests.\n- Confirmation that this resolves all reported intermittent vehicle disappearances on the original MSTS route and NVIDIA GPU is pending.\n- Native editor code is unchanged; corresponding source and TSRE5vc credits are included."
                ;;
              v0.1.6)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### MSTS track placement\n- Preserves yaw, pitch and roll in imported endpoints and runtime track positions, using the Open Rails displacement convention.\n- Fixes flattened sections that caused wheels to jump in height and cars to float or tilt at section joins.\n- Uses cached placement matrices and three-dimensional curve bases, including zero-height PAT lookups and older cached endpoints.\n- Reconstructs missing track-item positions with the same geometry.\n\n### Signal shapes\n- Finds signal heads by their global TDB identity instead of indexing local references that can change after merging or reordering.\n- Prevents wrong-head selection and the reported out-of-range scenery loading error.\n- Adds production-code regressions for gradients, curves, tiles, caches, actual wheel placement in both directions and signal lookup.\n\n### Included updates\n- Includes the camera-frame rendering and startup crash fixes.\n- Includes the native editor suite; editor code is unchanged. Credits TSRE5vc creator Piotr Gadecki (GokuMK), with corresponding source included.\n\n### Known status\n- Confirmation on the reported original MSTS route and NVIDIA GPU remains pending.\n- The reported black flashes still need route-specific confirmation of the earlier rendering fix.\n- Zink remains experimental; older saves and multiplayer have not been fully verified."
                ;;
              v0.1.5)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Rendering consistency\n- Captured camera view and projection matrices with each prepared frame, so the next updater pass cannot change the camera being used to draw it.\n- Applied the captured matrices to opaque and blended passes, shadow direction and distant mountains.\n- Added regression tests for tile-sized camera movement, projection changes, independent prepared frames and the loading screen.\n\n### Included updates\n- Includes the missing-sun and unplaced-speedpost startup crash fixes from 0.1.4.\n- Includes the native editor suite and experimental Vulkan activation through Mesa Zink; editor code is unchanged in this update.\n- Includes English documentation and credits TSRE5vc creator Piotr Gadecki (GokuMK), with the editors' corresponding source.\n\n### Known status\n- A rendering race is fixed; confirmation that it resolves the reported black flashes on the affected route and GPU remains pending.\n- Zink remains experimental.\n- Older-save compatibility and multiplayer have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              v0.1.4)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Startup crash fixes\n- Fixed SunMoonPos.SolarAngle when an ENV file has no recognized sun, including empty satellite light/type blocks; the existing astronomical fallback is used.\n- Fixed SignalEnvironment.InsertNode when an unplaced speedpost retained an invalid signal index after multi-head signals were merged.\n- Prevented unplaced speedposts from reusing another signal's speed restriction; correctly placed signals and posts keep their behavior.\n- Added production-code regression tests for the sky calculation, ENV parser, signal scanning, head merging and circuit insertion.\n\n### Included updates\n- Includes the native editor suite, editor stability/loading fixes and experimental Vulkan activation through Mesa Zink from 0.1.3.\n- Expanded English README, installation, architecture and feature documentation, included in the portable package.\n- Credits TSRE5vc creator Piotr Gadecki (GokuMK) and includes the editors' corresponding source.\n\n### Known status\n- Black flashes during gameplay remain under investigation.\n- Zink remains experimental.\n- Older-save compatibility and multiplayer have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              v0.1.3)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Editor stability and loading\n- Fixed concurrent native editor logging that could corrupt memory and crash both Route and Consist Editors.\n- Rejected truncated DDS pixel data and unsafe texture dimensions before decoding.\n- Improved case-insensitive MSTS content lookup for split GLOBAL/Global directories, route shapes and textures, including X/Y Tracks.\n- Bounded directory caching and texture-loader concurrency to reduce repeated work while preserving editor behavior.\n- Verified both editors with real main-window, shape and GPU-texture smoke tests; added sanitizer checks for logging and DDS decoding.\n\n### Simulator and graphics\n- Fixed experimental Vulkan activation on Linux through Mesa Zink before the graphics context is created.\n- F3 now reports the actual graphics renderer, including OpenGL over Vulkan (Zink) when active.\n- Includes the latest simulator loading, AI visual streaming and graphics compatibility updates from main.\n\n### Compatibility / known issues\n- Bundled Riel assemblies already use the \`Riel.*\` names.\n- Only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding.\n- Older saves have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              *)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\nBundled Riel assemblies use the \`Riel.*\` names; only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding."
                ;;
            esac
          }

          # Keep the published stable changelogs accurate without moving their
          # already-tested tags or replacing their assets.
          for published_tag in v0.1.0 v0.1.1 v0.1.2; do
            if gh release view "$published_tag" >/dev/null 2>&1; then
              published_sha="$(git rev-list -n 1 "$published_tag")"
              published_version="${published_tag#v}"
              published_notes="$(release_notes "$published_tag" "$published_sha")"
              gh release edit "$published_tag" --title "Riel $published_version" --notes "$published_notes"
            fi
          done

          tag="v$version"
          title="Riel $version"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Keep the already-tested tag and assets immutable, but allow release-note
            # corrections without publishing a new binary.
            target_sha="$(git rev-list -n 1 "$tag")"
            notes="$(release_notes "$tag" "$target_sha")"
            gh release edit "$tag" --latest --title "$title" --notes "$notes"
            echo "Stable release $tag already exists; updated notes only, leaving tested commit and assets unchanged"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a release; refusing to move it" >&2
            exit 1
          fi
          notes="$(release_notes "$tag" "$GITHUB_SHA")"
          gh release create "$tag" \
            "${RUNNER_TEMP}/riel-linux-x64.zip" \
            "${RUNNER_TEMP}/riel-linux-x64.zip.sha256" \
            "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" \
            --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes"
